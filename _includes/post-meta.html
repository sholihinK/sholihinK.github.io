<div class="post-meta">
  <span class="post-date">{{ include.post.date | date: "%b %d, %Y" }}</span>
  {% if include.post.read_time %}
    <span class="post-separator">•</span>
    <span class="post-read-time">{{ include.post.read_time }}</span>
  {% endif %}
  {% if include.post.category %}
    <span class="post-separator">•</span>
    <span class="post-category-badge">{{ include.post.category }}</span>
  {% endif %}
</div>
